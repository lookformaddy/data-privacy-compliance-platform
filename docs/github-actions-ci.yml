# CI definition for data-privacy-compliance-platform.
#
# NOTE: this file lives under docs/ on purpose. The GitHub integration used
# to push this project rejects files under .github/workflows/ (it lacks the
# Workflows permission), so the workflow activates by moving this file to
# .github/workflows/ci.yml in the repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/ -q
